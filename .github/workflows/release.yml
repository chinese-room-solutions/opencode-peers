name: release

# Tag push → npm tarball → GitHub release. Tag must match package.json's
# version; leading v optional (0.1.0 or v0.1.0). Real-host suites skip here
# (no opencode binary on PATH); unit tests gate the package.

on:
  push:
    tags: ['v*', '[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME is $tag but package.json is $ver"
            exit 1
          fi
      - run: npm ci
      - name: Test (unit) and package tarball
        run: |
          npm test
          npm pack
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: if the release already exists (created manually or by a
        # re-run), fall back to uploading the tarball into it.
        run: >
          gh release create "$GITHUB_REF_NAME" *.tgz --title "$GITHUB_REF_NAME" --generate-notes
          || gh release upload "$GITHUB_REF_NAME" *.tgz --clobber
